[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winners_curse"
version = "0.1.0"
description = "This project provide tools for analyzing and correcting for the winner's curse. "
requires-python = ">=3.13"
dependencies = [
    "econml>=0.16.0",
    "jax>=0.8.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "numpyro>=0.19.0",
    "pandas>=2.3.3",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.4.10",
    "notebook>=7.4.7",
    "pytest>=8.4.2",
]