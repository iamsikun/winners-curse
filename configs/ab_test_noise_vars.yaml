# Configuration for A/B test experiment with varying noise distributions

# Environment settings for multiprocessing
environment:
  openblas_num_threads: 1
  mkl_num_threads: 1
  numexpr_num_threads: 1
  omp_num_threads: 1

# Optimization parameters
optimization_params:
  optimizer: select_higher_effect
  params: {}
  display_name: Rank and Select

# Data generation process parameters
dgp_params:
  # Baseline treatment effects (will be overridden by comparative_statics if specified)
  base_effects:
    - type: PointMass
      value: 1
    - type: PointMass
      value: 1.01
  noise_vars: 
    - type: UnivariateGaussian
      mean: 0
      std: 1
    - type: UnivariateGaussian
      mean: 0
      std: 1
  response_type: continuous
  dgp_seed: 0

# Data parameters
data_params:
  sample_size: 2500

# Experiment parameters
experiment_params:
  n_repeats: 1000
  fixed_params: True

# Estimators dictionary
estimators_dict:
  standard_bootstrap:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      bootstrap_method: standard
      n_jobs: 1
    display_name: Standard Bootstrap
    latex_name: Standard Bootstrap
  m_out_of_n_bootstrap:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      power: 0.95
      bootstrap_method: m_out_of_n
      n_jobs: 1
    display_name: m-out-of-n Bootstrap
    latex_name: m-out-of-n Bootstrap
  sample_splitting:
    estimator: sample_splitting_estimate
    params:
      estimation_split: 0.5
      n_jobs: 1
    display_name: Sample Splitting
    latex_name: Sample Splitting
  eb_normal:
    estimator: empirical_bayes_estimate
    params:
      prior: normal
      prior_orientation: treatment
      dof: 1
    display_name: Empirical Bayes
    latex_name: Empirical Bayes
  hybrid_si:
    estimator: selective_inference_estimate
    params:
      method: hybrid
      quantile: 0.5
      n_jobs: 1
    display_name: Hybrid SI
    latex_name: "\\begin{tabular}[c]{@{}c@{}}Hybrid\\ Selective Inference\\end{tabular}"

# Comparative statics: parameters to vary across experiments
comparative_statics:
  # Noise distributions to test
  noise_vars_list:
    # Gaussian noise (baseline)
    - - type: UnivariateGaussian
        mean: 0
        std: 1
      - type: UnivariateGaussian
        mean: 0
        std: 1

    # Uniform noise
    - - type: Uniform
        a: -3 ** 0.5
        b: 3 ** 0.5
      - type: Uniform
        a: -3 ** 0.5
        b: 3 ** 0.5
    
    # Laplace noise
    - - type: Laplace
        mu: 0
        b: 2 ** -0.5
      - type: Laplace
        mu: 0
        b: 2 ** -0.5

    # Logistic noise
    - - type: Logistic
        mu: 0
        s: 3 ** 0.5 / pi
      - type: Logistic
        mu: 0
        s: 3 ** 0.5 / pi

# Parallel processing settings
parallel:
  max_jobs: 24

# Output settings
output:
  results_dir: results
  filename: results.pkl
