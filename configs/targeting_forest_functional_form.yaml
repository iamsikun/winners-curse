# Configuration for targeting causal forest with functional-form sweep (paper Table D.6)
# Produces results comparable to paper pickle targeting_forest_functional_form_20251213_135015

# Environment settings for multiprocessing
environment:
  openblas_num_threads: 1
  mkl_num_threads: 1
  numexpr_num_threads: 1
  omp_num_threads: 1

# Optimization parameters
optimization_params:
  optimizer: optimize  # Function name from winners_curse.targeting
  params: {}
  display_name: Rank and Select

# Data generation process parameters
dgp_params:
  base_effect_vars:
    - type: PointMass
      value: 1.0
    - type: PointMass
      value: 1.01
  cust_feat_var:
    type: UnivariateGaussian
    mean: 0
    std: 1
  char_func: "x**2 + x"  # Baseline (overridden by comparative_statics.char_func_list)
  noise_vars:
    - type: UnivariateGaussian
      mean: 0
      std: 1
    - type: UnivariateGaussian
      mean: 0
      std: 1
  response_type: continuous
  dgp_seed: 0

# Data parameters
data_params:
  sample_size: 2500
  targ_sample_size: 10000

# Experiment parameters
experiment_params:
  n_repeats: 1000
  estimator:
    estimator: CausalForestDML
    params:
      n_treatments: 2
      model_t:
        class: LogisticRegression
        params:
          C: 0.01
      model_y:
        class: Lasso
        params:
          alpha: 0.01
      n_estimators: 100
      max_depth: 5
      n_jobs: 1
      discrete_treatment: true

# Estimators dictionary (same 5 as targeting_forest_snr.yaml)
estimators_dict:
  standard_bootstrap:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      n_jobs: 1
    display_name: Standard Bootstrap
    latex_name: Standard Bootstrap
  mn_bootstrap:
    estimator: bootstrap_correction_estimate
    params:
      bootstrap_method: moon
      n_bootstraps: 100
      power: 0.6
      n_jobs: 1
    display_name: m-out-of-n Bootstrap
    latex_name: m-out-of-n Bootstrap
  sample_splitting:
    estimator: sample_splitting_estimate
    params:
      estimation_split: 0.5
    display_name: Sample Splitting
    latex_name: Sample Splitting
  eb_normal:
    estimator: empirical_bayes_estimate
    params:
      prior: normal
      dof: 3
      bin_width: 0.2
    display_name: Empirical Bayes
    latex_name: Empirical Bayes
  hybrid_si:
    estimator: selective_inference_estimate
    params:
      method: hybrid
      quantile: 0.5
      n_jobs: 1
    display_name: Hybrid SI
    latex_name: "\\begin{tabular}[c]{@{}c@{}}Hybrid\\\\ Selective Inference\\end{tabular}"

# Comparative statics: sweep over char_func forms
# Paper Table D.6 columns: x, x**2 + x, |x|
comparative_statics:
  char_func_list:
    - "x"
    - "x**2 + x"
    - "np.abs(x)"

# Parallel processing settings
parallel:
  max_jobs: 16  # 16 physical cores on this box; prior SIGBUS cap was a macOS/BIOS issue, since fixed

# Output settings
output:
  results_dir: results
  filename: results.pkl
