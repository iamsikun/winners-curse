# Configuration for m-out-of-n bootstrap scaling experiment
# Tests whether scaling WC by sqrt(m/N) fixes overcorrection

# Environment settings for multiprocessing
environment:
  openblas_num_threads: 1
  mkl_num_threads: 1
  numexpr_num_threads: 1
  omp_num_threads: 1

# Optimization parameters
optimization_params:
  optimizer: select_higher_effect
  params: {}
  display_name: Rank and Select

# Data generation process parameters
dgp_params:
  base_effects:
    - type: PointMass
      value: 1
    - type: PointMass
      value: 1.005
  noise_vars:
    - type: UnivariateGaussian
      mean: 0
      std: 1
    - type: UnivariateGaussian
      mean: 0
      std: 1
  response_type: continuous
  dgp_seed: 0

# Data parameters
data_params:
  sample_size: 500

# Experiment parameters
experiment_params:
  n_repeats: 1000
  fixed_params: True

# Estimators dictionary
estimators_dict:
  standard_bootstrap:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      bootstrap_method: standard
      n_jobs: 1
    display_name: Standard Bootstrap
    latex_name: Standard Bootstrap
  moon_080_unscaled:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      bootstrap_method: moon
      power: 0.8
      n_jobs: 1
    display_name: m-out-of-n (gamma=0.8)
    latex_name: m-out-of-n ($\gamma=0.8$)
  moon_080_scaled:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      bootstrap_method: moon_scaled
      power: 0.8
      n_jobs: 1
    display_name: m-out-of-n (gamma=0.8, scaled)
    latex_name: m-out-of-n ($\gamma=0.8$, scaled)
  moon_095_unscaled:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      bootstrap_method: moon
      power: 0.95
      n_jobs: 1
    display_name: m-out-of-n (gamma=0.95)
    latex_name: m-out-of-n ($\gamma=0.95$)
  moon_095_scaled:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      bootstrap_method: moon_scaled
      power: 0.95
      n_jobs: 1
    display_name: m-out-of-n (gamma=0.95, scaled)
    latex_name: m-out-of-n ($\gamma=0.95$, scaled)

# Comparative statics: 2D sweep over SNR x sample size
comparative_statics:
  tau_list:
    - [1, 1.005]
    - [1, 1.01]
    - [1, 1.02]
    - [1, 1.05]
  sample_size_list:
    - 500
    - 1000
    - 2500
    - 5000

# Parallel processing settings
parallel:
  max_jobs: 24

# Output settings
output:
  results_dir: results
  filename: results.pkl
