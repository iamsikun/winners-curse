# Configuration for targeting causal forest experiment

# Environment settings for multiprocessing
environment:
  openblas_num_threads: 1
  mkl_num_threads: 1
  numexpr_num_threads: 1
  omp_num_threads: 1

# Optimization parameters
optimization_params:
  rank_and_select:
    optimizer: optimize  # Function name from winners_curse.targeting
    params: {}
    display_name: Rank and Select

# Data generation process parameters
dgp_params:
  # Baseline treatment effects (will be overridden by comparative_statics.tau_list if specified)
  base_effect_vars:
    - type: PointMass
      value: 1.0
    - type: PointMass
      value: 1.01
  cust_feat_var:
    type: UnivariateGaussian
    mean: 0
    std: 1
  char_func: "x**2 + x"  # Lambda function as string expression
  noise_vars:
    - type: UnivariateGaussian
      mean: 0
      std: 1
    - type: UnivariateGaussian
      mean: 0
      std: 1
  response_type: continuous
  dgp_seed: 0

# Data parameters
data_params:
  sample_size: 2500  # Baseline (overridden by comparative_statics.sample_size_list if specified)
  targ_sample_size: 10000

# Experiment parameters
experiment_params:
  n_repeats: 500
  estimator:
    estimator: CausalForestDML  # Class name from winners_curse.targeting
    params:
      n_treatments: 2  # Will be set dynamically based on base_effect_vars length
      model_t:
        class: LogisticRegression
        params:
          C: 0.01
      model_y:
        class: Lasso
        params:
          alpha: 0.01
      n_estimators: 100
      max_depth: 5  # Baseline (overridden by comparative_statics.depth_list if specified)
      n_jobs: 1  # CRITICAL: Set to 1 to avoid nested parallelism 
      discrete_treatment: true

# Estimators dictionary
estimators_dict: {}

# Comparative statics: parameters to vary across experiments (ALL OPTIONAL)
# Only include parameters you want to vary; others use baseline values above
# Maximum 2 parameter lists can vary simultaneously (error if more than 2)
comparative_statics:
  # Tree depths to test (overrides estimator.max_depth)
  depth_list:
    - 5
    - 10
    - 15

  # Sample sizes to test (overrides data_params.sample_size)
  sample_size_list:
    - 2500
    - 5000
    - 10000
    - 15000
    - 20000
    - 30000
    - 40000
    - 50000
    - 100000
    - 500000
    - 1000000

# Parallel processing settings
parallel:
  max_jobs: 30  # Will be min(max_jobs, cpu_count())

# Output settings
output:
  results_dir: results
  filename: results.pkl

