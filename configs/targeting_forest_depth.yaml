# Configuration for targeting causal forest experiment

# Environment settings for multiprocessing
environment:
  openblas_num_threads: 1
  mkl_num_threads: 1
  numexpr_num_threads: 1
  omp_num_threads: 1

# Optimization parameters
optimization_params:
  optimizer: optimize  # Function name from winners_curse.targeting
  params: {}
  display_name: Rank and Select

# Data generation process parameters
dgp_params:
  # Baseline treatment effects (will be overridden by comparative_statics.tau_list if specified)
  base_effect_vars:
    - type: PointMass
      value: 1.0
    - type: PointMass
      value: 1.01
  cust_feat_var:
    type: UnivariateGaussian
    mean: 0
    std: 1
  char_func: "x**2 + x"  # Lambda function as string expression
  noise_vars:
    - type: UnivariateGaussian
      mean: 0
      std: 1
    - type: UnivariateGaussian
      mean: 0
      std: 1
  response_type: continuous
  dgp_seed: 0

# Data parameters
data_params:
  sample_size: 2500  # Baseline (overridden by comparative_statics.sample_size_list if specified)
  targ_sample_size: 10000

# Experiment parameters
experiment_params:
  n_repeats: 500

  # n = 5M costs ~25 min per fit at depth 5 (~50 min at depth 15) and only two
  # workers fit in memory, so 500 repeats there would run for weeks. Keys follow
  # the same "smallest sample_size this applies to" convention as
  # parallel.max_jobs_by_sample_size. Raise this if the extra precision at the
  # tail of the bias curve is worth the wall clock.
  n_repeats_by_sample_size:
    0: 500
    5000000: 20
  estimator:
    estimator: CausalForestDML  # Class name from winners_curse.targeting
    params:
      n_treatments: 2  # Will be set dynamically based on base_effect_vars length
      model_t:
        class: LogisticRegression
        params:
          C: 0.01
      model_y:
        class: Lasso
        params:
          alpha: 0.01
      n_estimators: 100
      max_depth: 5  # Baseline (overridden by comparative_statics.depth_list if specified)
      n_jobs: 1  # CRITICAL: Set to 1 to avoid nested parallelism 
      discrete_treatment: true

# Estimators dictionary
estimators_dict: {}

# Comparative statics: parameters to vary across experiments (ALL OPTIONAL)
# Only include parameters you want to vary; others use baseline values above
# Maximum 2 parameter lists can vary simultaneously (error if more than 2)
comparative_statics:
  # Tree depths to test (overrides estimator.max_depth)
  depth_list:
    - 5
    - 10
    - 15

  # Sample sizes to test (overrides data_params.sample_size)
  sample_size_list:
    - 2500
    - 5000
    - 10000
    - 15000
    - 20000
    - 30000
    - 40000
    - 50000
    - 100000
    - 500000
    - 1000000
    - 5000000

# Parallel processing settings
parallel:
  max_jobs: 32  # 32 logical cores; measured 1.41x throughput over 16 on bootstrap refits

  # Each worker fits a causal forest on the whole sample, so peak RSS grows with
  # sample_size and 32 workers would oversubscribe a 47 GB box well before n = 1M.
  # Keys are the smallest sample_size an entry applies to; gb_per_job is measured
  # peak RSS of one worker (largest depth in the sweep), and jobs are capped again
  # at launch so jobs * gb_per_job stays under memory_fraction of free memory.
  # Measured single-fit RSS: 0.74 GB at n=100k, 1.8 GB at 500k, 2.8 GB at 1M,
  # 11.4 GB at 5M.
  memory_fraction: 0.75
  max_jobs_by_sample_size:
    0:       {max_jobs: 32, gb_per_job: 0.8}
    500000:  {max_jobs: 15, gb_per_job: 2.2}
    1000000: {max_jobs: 10, gb_per_job: 3.6}
    5000000: {max_jobs: 2,  gb_per_job: 12.5}

# Output settings
output:
  results_dir: results
  filename: results.pkl

