# Configuration for targeting causal forest experiment

# Environment settings for multiprocessing
environment:
  openblas_num_threads: 1
  mkl_num_threads: 1
  numexpr_num_threads: 1
  omp_num_threads: 1

# Optimization parameters
optimization_params:
  optimizer: optimize  # Function name from winners_curse.targeting
  params: {}
  display_name: Rank and Select

# Data generation process parameters
dgp_params:
  base_effect_vars: [null, null]  # Will be set dynamically based on tau_list
  cust_feat_var:
    type: Uniform
    a: 0
    b: 1
  char_func: "x**2 + x"  # Lambda function as string expression
  # noise_vars is required by the script but ignored for Bernoulli sampling
  noise_vars:
    - type: UnivariateGaussian
      mean: 0
      std: 1
    - type: UnivariateGaussian
      mean: 0
      std: 1
  response_type: bernoulli
  dgp_seed: 0

# Data parameters
data_params:
  sample_size: 2500
  targ_sample_size: 10000

# Experiment parameters
experiment_params:
  n_repeats: 1000
  estimator:
    estimator: CausalForestDML  # Class name from winners_curse.targeting
    params:
      n_treatments: 2  # Will be set dynamically based on base_effect_vars length
      model_t:
        class: LogisticRegression
        params:
          C: 0.01
      model_y:
        class: LogisticRegression
        params:
          C: 0.01
      n_estimators: 100
      max_depth: 5
      n_jobs: 1
      discrete_treatment: true
      discrete_outcome: true

# Estimators dictionary
estimators_dict:
  standard_bootstrap:
    estimator: bootstrap_correction_estimate
    params:
      n_bootstraps: 100
      n_jobs: 1
    display_name: Standard Bootstrap
    latex_name: Standard Bootstrap
  mn_bootstrap:
    estimator: bootstrap_correction_estimate
    params:
      bootstrap_method: moon
      n_bootstraps: 100
      power: 0.6
      n_jobs: 1
    display_name: m-out-of-n Bootstrap
    latex_name: m-out-of-n Bootstrap
  sample_splitting:
    estimator: sample_splitting_estimate
    params:
      estimation_split: 0.5
    display_name: Sample Splitting
    latex_name: Sample Splitting
  eb_normal:
    estimator: empirical_bayes_estimate
    params:
      prior: normal
      dof: 3
      bin_width: 0.2
    display_name: Empirical Bayes
    latex_name: Empirical Bayes
  hybrid_si:
    estimator: selective_inference_estimate
    params:
      method: hybrid
      quantile: 0.5
      n_jobs: 1
    display_name: Hybrid SI
    latex_name: "\\begin{tabular}[c]{@{}c@{}}Hybrid\\\\ Selective Inference\\end{tabular}"

# Treatment effect values to test
tau_list:
  - [0.1, 0.101]
  - [0.2, 0.201]
  - [0.3, 0.301]
  - [0.1, 0.105]
  - [0.2, 0.205]
  - [0.3, 0.305]

# Parallel processing settings
parallel:
  max_jobs: 16  # 16 physical cores on this box; prior SIGBUS cap was a macOS/BIOS issue, since fixed

# Output settings
output:
  results_dir: results
  filename: results.pkl
